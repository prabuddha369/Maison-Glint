<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 400;
        src: url('data:font/truetype;charset=utf-8;base64,') format('truetype');
      }
      .brand-title {
        font-family: 'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 0.22em;
        fill: #111111;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .brand-rule {
        stroke: #c5a059;
        stroke-width: 1.25;
        stroke-linecap: square;
      }
    </style>
  </defs>

  <!-- Top accent rule -->
  <line x1="144" y1="24" x2="176" y2="24" class="brand-rule" />

  <!-- Center typography (162 is optical center accounting for trailing letter-spacing) -->
  <text x="162" y="52" class="brand-title">MAISON GLINT</text>

  <!-- Bottom accent rule -->
  <line x1="144" y1="80" x2="176" y2="80" class="brand-rule" />
</svg>
